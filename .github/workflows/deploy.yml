# CI + canlıya alma
#  - Her push/PR: client lint + build, server bağımlılık + import kontrolü
#  - main'e push: client -> Vercel
#                 server -> Docker imajı (model: son "model-*" GitHub Release'i)
#                           -> GitHub Container Registry -> Render
#
# Gerekli GitHub ayarları (Settings -> Secrets and variables -> Actions):
#  secrets:   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, RENDER_API_KEY, RENDER_SERVICE_ID
#  variables: VITE_API_BASE  (ör. https://movimind-api.onrender.com)
#             VITE_SITE_URL  (ör. https://movimind.vercel.app)
#             DEPLOY_ENABLED=true  (platformlar kurulana kadar yalnızca CI çalışır)
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Uygulama import kontrolü
        env:
          RUN_PIPELINE: "false"
        run: python -c "from app.server import create_app; create_app()"

  # Vercel'in GitHub Actions yöntemi: build burada yapılır, hazır çıktı yüklenir
  deploy-client:
    needs: [client, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Client -> Vercel
        run: |
          npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-server:
    needs: [client, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Model dosyasını son "model-*" Release'inden indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --exclude-drafts --limit 100 --json tagName \
                --jq '[.[] | select(.tagName | startswith("model-"))][0].tagName')
          if [ -z "$TAG" ]; then
            echo "::error::'model-' ile başlayan bir GitHub Release bulunamadı"; exit 1
          fi
          gh release download "$TAG" --pattern knn_model.pkl --dir server/artifacts
          echo "Model: $TAG ($(du -h server/artifacts/knn_model.pkl | cut -f1))"

      - name: İmaj adı (GHCR küçük harf ister)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/movimind-api" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # İmajı GitHub'da bu depoyla ilişkilendirir (Packages bölümünde görünür)
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Render servisi henüz kurulmadıysa (ilk çalıştırma) bu adım atlanır
      - name: Server -> Render (bu commit'in imajıyla)
        if: env.RENDER_SERVICE_ID != ''
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"${IMAGE}:${{ github.sha }}\"}"
