server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter): /movie/1 gibi yollar index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite dosya adları içerik özetli; uzun süre önbelleklenebilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
