# Yerel çalıştırma (Docker ile):  docker compose up --build
#   Arayüz: http://localhost:5173   API: http://localhost:8000 (Swagger: /docs)
# Ayarlar server/.env'den okunur. Veri seti ve model klasörleri bilgisayardan bağlanır;
# RUN_PIPELINE=true ise gerekirse temizleme/eğitim/yayın container içinde çalışır.
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: server/.env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./server/data:/app/server/data
      - ./server/artifacts:/app/server/artifacts

  client:
    build:
      context: client
      args:
        VITE_API_BASE: http://localhost:8000
        VITE_SITE_URL: http://localhost:5173
    ports:
      - "5173:80"
    depends_on:
      - server
